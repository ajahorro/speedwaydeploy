<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1118" width="1240" height="1118" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1240" height="1118" fill="#fff"/>
<text x="620" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Flowchart: Role-Based Access Control</text>
<path d="M330,142 L330,180" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M455,232 L501,232" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="225" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,284 L330,322" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="302" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M455,374 L501,374" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="367" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,426 L330,464" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="444" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M455,516 L501,516" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="509" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,568 L330,606" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="586" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M455,658 L501,658" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="651" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,710 L330,748" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="728" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M330,814 L330,852" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,918 L330,956" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="205" y="90" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="330" y="112.33333333333333">A signed-in user opens a page or</tspan><tspan x="330" y="128.33333333333331">asks for data</tspan></text>
<polygon points="330,180 455,232 330,284 205,232" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="228.41666666666666">Layer 1, the screen: is</tspan><tspan x="330" y="243.91666666666666">there a valid session?</tspan></text>
<polygon points="330,322 455,374 330,426 205,374" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="370.4166666666667">Does the user's role</tspan><tspan x="330" y="385.9166666666667">allow this page?</tspan></text>
<polygon points="330,464 455,516 330,568 205,516" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="504.6666666666667">Layer 2, the server: is</tspan><tspan x="330" y="520.1666666666667">the caller allowed this</tspan><tspan x="330" y="535.6666666666667">action?</tspan></text>
<polygon points="330,606 455,658 330,710 205,658" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="646.6666666666666">Layer 3, the database:</tspan><tspan x="330" y="662.1666666666666">does row-level security</tspan><tspan x="330" y="677.6666666666666">allow these records?</tspan></text>
<rect x="205" y="748" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="761.3333333333334">Protected fields (role, joined</tspan><tspan x="330" y="777.3333333333334">date, report access) are</tspan><tspan x="330" y="793.3333333333334">administrator-only; the last</tspan><tspan x="330" y="809.3333333333334">administrator cannot be removed</tspan></text>
<rect x="205" y="852" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="881.3333333333334">Important administrator actions</tspan><tspan x="330" y="897.3333333333334">are written to the audit log</tspan></text>
<rect x="205" y="956" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="330" y="986.3333333333334">Request allowed</tspan></text>
<rect x="501" y="186" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="228.58333333333334">Sent to login, then</tspan><tspan x="581" y="243.08333333333334">back to the same page</tspan></text>
<rect x="501" y="328" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="377.8333333333333">Sent to the home page</tspan></text>
<rect x="501" y="470" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="512.5833333333334">Request refused (not</tspan><tspan x="581" y="527.0833333333334">authorised)</tspan></text>
<rect x="501" y="612" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="654.5833333333334">Records hidden or</tspan><tspan x="581" y="669.0833333333334">change refused</tspan></text>
<rect x="800" y="210" width="400" height="330" rx="10" fill="none" stroke="#111" stroke-width="1.8"/>
<rect x="800" y="210" width="400" height="34" rx="10" fill="#111"/>
<text x="1000" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">What each role can reach</text>
<line x1="800" y1="250" x2="1200" y2="250" stroke="#bbb"/>
<text x="814" y="270" font-size="13" font-weight="800" fill="#111">Customer</text>
<text font-size="12" fill="#111"><tspan x="814" y="290">Own bookings, vehicles, payments, receipts, and chat</tspan><tspan x="814" y="305">only.</tspan></text>
<line x1="800" y1="328" x2="1200" y2="328" stroke="#bbb"/>
<text x="814" y="348" font-size="13" font-weight="800" fill="#111">Staff</text>
<text font-size="12" fill="#111"><tspan x="814" y="368">Only the vehicles assigned to them: photos, notes,</tspan><tspan x="814" y="383">and start or finish. No payments, prices, refunds,</tspan><tspan x="814" y="398">or other accounts. Reports only if the administrator</tspan><tspan x="814" y="413">turns them on.</tspan></text>
<line x1="800" y1="456" x2="1200" y2="456" stroke="#bbb"/>
<text x="814" y="476" font-size="13" font-weight="800" fill="#111">Administrator</text>
<text font-size="12" fill="#111"><tspan x="814" y="496">All bookings, payments, refunds, reports, accounts,</tspan><tspan x="814" y="511">settings, and the audit log.</tspan></text>
<rect x="800" y="570" width="400" height="104" rx="10" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1000" y="594" text-anchor="middle" font-size="13" font-weight="800" fill="#111">Access is re-checked while signed in</text>
<text font-size="12" fill="#111"><tspan x="814" y="616">Every minute, and each time the user returns to the</tspan><tspan x="814" y="631">tab, the system re-reads the role and active status. A</tspan><tspan x="814" y="646">changed role refreshes the session; a deactivated</tspan><tspan x="814" y="661">account is signed out at once.</tspan></text>
</svg>