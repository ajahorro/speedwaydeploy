<text text-anchor="middle" font-size="13.5" font-weight="800" fill="#111"><tspan x="820" y="272.5">Backend service (Express), hosted on Render</tspan></text>
<rect x="632" y="284" width="184" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="724" y="310.1666666666667">Booking rules</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="724" y="332.6666666666667">Hours, closed days, minimum</tspan><tspan x="724" y="346.6666666666667">notice, capacity</tspan></text>
<rect x="824" y="284" width="184" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="916" y="310.1666666666667">Technician assignment</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="916" y="332.6666666666667">Set per vehicle by the</tspan><tspan x="916" y="346.6666666666667">administrator; workload limit</tspan><tspan x="916" y="360.6666666666667">per staff</tspan></text>
<rect x="632" y="396" width="184" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="724" y="422.1666666666667">Receipt reading (OCR)</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="724" y="444.6666666666667">Tesseract reads the amount,</tspan><tspan x="724" y="458.6666666666667">reference, and account</tspan></text>
