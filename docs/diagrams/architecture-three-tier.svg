<rect x="1110" y="718" width="200" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="1210" y="744.1666666666666">Resend</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1210" y="766.6666666666666">Delivers the emails</tspan></text>
<rect x="1330" y="718" width="190" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="1425" y="744.1666666666666">GCash and bank apps</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1425" y="766.6666666666666">Customer pays there, then</tspan><tspan x="1425" y="780.6666666666666">uploads the receipt</tspan></text>
<path d="M920,623 L920,757 L1110,757" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="950" y="748.8333333333334">Emails</tspan></text>
<text x="30" y="730" font-size="14" font-weight="800" fill="#111">SECURITY</text>
<rect x="190" y="690" width="205" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="292.5" y="716.1666666666666">Encrypted in transit</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="292.5" y="738.6666666666666">HTTPS everywhere</tspan></text>
<rect x="405" y="690" width="205" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="507.5" y="716.1666666666666">Row-level security</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="507.5" y="738.6666666666666">And a role check on every request</tspan></text>
<rect x="620" y="690" width="205" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="722.5" y="716.1666666666666">Sign-in protection</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="722.5" y="738.6666666666666">Lockout and automatic sign-out</tspan></text>
<text x="30" y="830" font-size="14" font-weight="800" fill="#111">PERFORMANCE</text>
<rect x="190" y="790" width="205" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="292.5" y="816.1666666666666">Cloud hosting</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="292.5" y="838.6666666666666">Vercel, Render, and Supabase scale</tspan><tspan x="292.5" y="852.6666666666666">without servers to manage</tspan></text>
<rect x="405" y="790" width="205" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="507.5" y="816.1666666666666">Live updates</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="507.5" y="838.6666666666666">Screens update without reloading</tspan></text>
<rect x="620" y="790" width="205" height="78" rx="8" fill="#fff" stroke="#111" stroke-width="1.3"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="722.5" y="816.1666666666666">Edge delivery</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="722.5" y="838.6666666666666">The website is served from</tspan><tspan x="722.5" y="852.6666666666666">Vercel's edge network</tspan></text>
<text x="30" y="915" font-size="11.5" fill="#111">Key: T1 is what people use, T2 is the web application and the backend that decide and check, T3 is where the data is kept. Ordinary data goes straight to Supabase, protected by row-level security; sensitive actions go through the backend.</text>
