<path d="M1020,450 L1110,450" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1065" y="424.5833333333333">Server</tspan><tspan x="1065" y="439.0833333333333">access</tspan></text>
<rect x="1090" y="680" width="450" height="130" rx="12" fill="#fff" stroke="#111" stroke-width="1.8" stroke-dasharray="7 4"/>
