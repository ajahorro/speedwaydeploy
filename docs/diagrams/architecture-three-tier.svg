<text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="820" y="144.66666666666666">Hosted on Vercel at comargarage.com. Separate screens</tspan><tspan x="820" y="158.66666666666666">for customers, staff, and administrators; live updates;</tspan><tspan x="820" y="172.66666666666666">automatic sign-out after 60 minutes of no activity</tspan></text>
