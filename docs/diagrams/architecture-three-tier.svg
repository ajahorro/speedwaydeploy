<rect x="824" y="508" width="184" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="800" fill="#111"><tspan x="916" y="534.1666666666666">Notification engine</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="916" y="556.6666666666666">In-app notices and emails for</tspan><tspan x="916" y="570.6666666666666">every status change</tspan></text>
