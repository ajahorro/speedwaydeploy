<text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1315" y="549.6666666666666">Sign-in and sessions, live updates (Realtime), file</tspan><tspan x="1315" y="563.6666666666666">storage for receipts and photos, email functions,</tspan><tspan x="1315" y="577.6666666666666">and scheduled database jobs</tspan></text>
