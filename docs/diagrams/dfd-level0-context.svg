<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 910" width="1500" height="910" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1500" height="910" fill="#fff"/>
<text x="750" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Data Flow Diagram (Level 0): Context Diagram</text>
<ellipse cx="750" cy="450" rx="190" ry="140" fill="#fff" stroke="#111" stroke-width="2.2"/>
<text x="750" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#111">0</text>
<text text-anchor="middle" font-size="16" font-weight="800" fill="#111"><tspan x="750" y="441.3333333333333">Comar Garage Online</tspan><tspan x="750" y="460.3333333333333">Appointment and</tspan><tspan x="750" y="479.3333333333333">Scheduling System</tspan></text>
<rect x="40" y="375" width="200" height="150" rx="0" fill="#fff" stroke="#111" stroke-width="2.2"/><text text-anchor="middle" font-size="15" font-weight="800" fill="#111"><tspan x="140" y="455">Customer</tspan></text>
<rect x="1260" y="375" width="200" height="150" rx="0" fill="#fff" stroke="#111" stroke-width="2.2"/><text text-anchor="middle" font-size="15" font-weight="800" fill="#111"><tspan x="1360" y="455">Administrator</tspan></text>
<rect x="630" y="60" width="240" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="2.2"/><text text-anchor="middle" font-size="15" font-weight="800" fill="#111"><tspan x="750" y="100">Staff</tspan></text>
<rect x="620" y="780" width="260" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="2.2"/><text text-anchor="middle" font-size="15" font-weight="800" fill="#111"><tspan x="750" y="820">Email Service</tspan></text>
<path d="M240,400 L572,400" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="406" y="322.0833333333333">Sign-up and sign-in details, booking</tspan><tspan x="406" y="336.5833333333333">requests, payment receipts,</tspan><tspan x="406" y="351.0833333333333">reschedule, cancel, and add-service</tspan><tspan x="406" y="365.5833333333333">requests, chat messages</tspan></text>
<path d="M572,500 L240,500" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="406" y="542.0833333333334">Available times and prices, booking</tspan><tspan x="406" y="556.5833333333334">confirmations, payment status,</tspan><tspan x="406" y="571.0833333333334">receipts, refund updates,</tspan><tspan x="406" y="585.5833333333334">notifications</tspan></text>
<path d="M1260,400 L928,400" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1094" y="322.0833333333333">Business settings, services, promos,</tspan><tspan x="1094" y="336.5833333333333">closures, walk-in bookings, payment</tspan><tspan x="1094" y="351.0833333333333">checks, refund decisions, staff</tspan><tspan x="1094" y="365.5833333333333">accounts and invitations</tspan></text>
<path d="M928,500 L1260,500" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1094" y="541.3333333333334">Bookings, payments, refunds,</tspan><tspan x="1094" y="555.8333333333334">reports, dashboards, audit logs,</tspan><tspan x="1094" y="570.3333333333334">alerts</tspan></text>
<path d="M640,130 L640,337" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="end" font-size="11.5" font-weight="600" fill="#111"><tspan x="630" y="224.33333333333334">Sign-in, shift start and</tspan><tspan x="630" y="238.83333333333334">end, vehicle start and</tspan><tspan x="630" y="253.33333333333334">finish, service photos</tspan></text>
<path d="M860,337 L860,130" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="870" y="224.33333333333334">Assigned vehicles and</tspan><tspan x="870" y="238.83333333333334">schedule, task</tspan><tspan x="870" y="253.33333333333334">notifications</tspan></text>
<path d="M640,563 L640,780" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="end" font-size="11.5" font-weight="600" fill="#111"><tspan x="630" y="654.0833333333334">Confirmations, receipts,</tspan><tspan x="630" y="668.5833333333334">reminders, invitations,</tspan><tspan x="630" y="683.0833333333334">recovery and security</tspan><tspan x="630" y="697.5833333333334">messages</tspan></text>
<path d="M860,780 L860,563" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="870" y="675.8333333333334">Delivery results</tspan></text>
<text x="40" y="885" font-size="11.5" fill="#111">Key: rectangle = external entity; ellipse = the whole system as a single process; arrow = data flow. The email messages reach customers, staff, and administrators through the email service.</text>
</svg>