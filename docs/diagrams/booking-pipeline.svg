<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 985" width="1400" height="985" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1400" height="985" fill="#fff"/>
<text x="700" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Conceptual Design: The Booking Pipeline (Status, Payment, and Refund)</text>
<rect x="40" y="60" width="1320" height="475" rx="10" fill="none" stroke="#111" stroke-width="1.8"/>
<rect x="40" y="60" width="1320" height="30" rx="10" fill="#111"/>
<text x="60" y="80" font-size="13" font-weight="800" fill="#fff">1. Booking status</text>
<rect x="75" y="152" width="190" height="66" rx="30" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="170" y="176.33333333333334">Scheduled</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="170" y="189.66666666666666">Booking created; it holds its</tspan><tspan x="170" y="203.66666666666666">time slot</tspan></text>
<rect x="425" y="152" width="190" height="66" rx="30" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="520" y="176.33333333333334">Confirmed</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="520" y="189.66666666666666">Downpayment paid and</tspan><tspan x="520" y="203.66666666666666">technicians set</tspan></text>
<rect x="775" y="152" width="190" height="66" rx="30" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="870" y="176.33333333333334">In progress</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="870" y="189.66666666666666">Work on the vehicles has</tspan><tspan x="870" y="203.66666666666666">started</tspan></text>
<rect x="1125" y="152" width="190" height="66" rx="30" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="1220" y="176.33333333333334">Completed</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1220" y="189.66666666666666">All vehicles done and fully</tspan><tspan x="1220" y="203.66666666666666">paid</tspan></text>
<path d="M265,185 L425,185" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="345" y="113.33333333333333">Downpayment verified and</tspan><tspan x="345" y="127.83333333333333">every vehicle has a</tspan><tspan x="345" y="142.33333333333331">technician</tspan></text>
<path d="M615,185 L775,185" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="695" y="134.58333333333334">Staff starts the first</tspan><tspan x="695" y="149.08333333333334">vehicle</tspan></text>
<path d="M965,185 L1125,185" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1045" y="119.33333333333333">All vehicles are done</tspan><tspan x="1045" y="133.83333333333331">and the booking is fully</tspan><tspan x="1045" y="148.33333333333331">paid</tspan></text>
<rect x="250" y="300" width="190" height="60" rx="30" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="345" y="324.3333333333333">No-show flagged</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="345" y="341.6666666666667">Undo allowed for 24 hours</tspan></text>
<path d="M200,218 L300,300" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M495,218 L390,300" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="345" y="251.33333333333334">Not started 1</tspan><tspan x="345" y="265.83333333333337">hour after the</tspan><tspan x="345" y="280.33333333333337">start time</tspan></text>
<path d="M440,330 L520,330 L520,218" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="528" y="293.8333333333333">Admin undo</tspan></text>
<rect x="70" y="434" width="700" height="56" rx="28" fill="#eee" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="420" y="458.3333333333333">Cancelled</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="420" y="473.6666666666667">Final state. Any payment made moves to the refund track below</tspan></text>
<path d="M110,218 L110,434" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="118" y="296.8333333333333">Customer or</tspan><tspan x="118" y="311.3333333333333">admin cancels,</tspan><tspan x="118" y="325.8333333333333">or the unpaid</tspan><tspan x="118" y="340.3333333333333">hold expires (30</tspan><tspan x="118" y="354.8333333333333">min)</tspan></text>
<path d="M345,360 L345,434" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="353" y="394.5833333333333">After 24 hours, or</tspan><tspan x="353" y="409.0833333333333">an admin cancels</tspan></text>
<path d="M605,218 L605,434" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="613" y="311.3333333333333">Customer or admin</tspan><tspan x="613" y="325.8333333333333">cancels before work</tspan><tspan x="613" y="340.3333333333333">starts</tspan></text>
<rect x="785" y="354" width="520" height="92" rx="12" fill="#fff" stroke="#111" stroke-width="1.8" stroke-dasharray="7 4"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="1045" y="378.3333333333333">Once work starts</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1045" y="404.6666666666667">The customer can no longer cancel or reschedule. A booking completes by itself when</tspan><tspan x="1045" y="418.6666666666667">every vehicle is done and the balance is paid.</tspan></text>
<rect x="40" y="550" width="1320" height="215" rx="10" fill="none" stroke="#111" stroke-width="1.8"/>
<rect x="40" y="550" width="1320" height="30" rx="10" fill="#111"/>
<text x="60" y="570" font-size="13" font-weight="800" fill="#fff">2. Payment</text>
<rect x="75" y="630" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="170" y="654.3333333333334">Unpaid</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="170" y="676.6666666666666">Nothing verified yet</tspan></text>
<rect x="425" y="630" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="520" y="654.3333333333334">Waiting for verification</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="520" y="676.6666666666666">Receipt or reference submitted</tspan></text>
<rect x="775" y="630" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="870" y="654.3333333333334">Partially paid</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="870" y="669.6666666666666">Required downpayment can be</tspan><tspan x="870" y="683.6666666666666">met here</tspan></text>
<rect x="1125" y="630" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="1220" y="654.3333333333334">Paid in full</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1220" y="676.6666666666666">Balance is zero</tspan></text>
<path d="M265,665 L425,665" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="345" y="601.3333333333334">Receipt uploaded and read</tspan><tspan x="345" y="615.8333333333334">(OCR); cash recorded by</tspan><tspan x="345" y="630.3333333333334">the administrator</tspan></text>
<path d="M615,665 L775,665" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="695" y="605.3333333333334">Administrator verifies</tspan><tspan x="695" y="619.8333333333334">an amount below the</tspan><tspan x="695" y="634.3333333333334">total</tspan></text>
<path d="M965,665 L1125,665" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1045" y="621.5833333333334">Balance paid and</tspan><tspan x="1045" y="636.0833333333334">verified</tspan></text>
<path d="M470,700 L470,733 L170,733 L170,700" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="320" y="729.8333333333334">Rejected: the customer sends a new proof</tspan></text>
<path d="M570,700 L570,750 L1220,750 L1220,700" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="900" y="746.8333333333334">Verified amount covers the whole total</tspan></text>
<rect x="40" y="780" width="1320" height="170" rx="10" fill="none" stroke="#111" stroke-width="1.8"/>
<rect x="40" y="780" width="1320" height="30" rx="10" fill="#111"/>
<text x="60" y="800" font-size="13" font-weight="800" fill="#fff">3. Refund after cancellation</text>
<rect x="75" y="840" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="170" y="864.3333333333334">Refund queued</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="170" y="879.6666666666666">Cancelled booking that had a</tspan><tspan x="170" y="893.6666666666666">payment</tspan></text>
<rect x="425" y="840" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="520" y="864.3333333333334">Administrator reviews</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="520" y="879.6666666666666">In the Refund Hub; amount</tspan><tspan x="520" y="893.6666666666666">decided</tspan></text>
<rect x="775" y="840" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="870" y="864.3333333333334">Refund recorded</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="870" y="886.6666666666666">Payment shows as Refunded</tspan></text>
<rect x="1125" y="840" width="190" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="1220" y="864.3333333333334">Customer informed</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1220" y="886.6666666666666">Refund receipt sent by email</tspan></text>
<path d="M265,875 L425,875" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="345" y="839.8333333333334">Admin opens the queue</tspan></text>
<path d="M615,875 L775,875" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="695" y="832.5833333333334">Refund paid out and</tspan><tspan x="695" y="847.0833333333334">saved</tspan></text>
<path d="M965,875 L1125,875" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1045" y="845.8333333333334">Receipt is generated</tspan></text>
<path d="M70,462 L22,462 L22,875 L75,875" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a)"/>
<text transform="translate(14 668.5) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" fill="#111">If a payment was made</text>
<text x="40" y="972" font-size="11.5" fill="#111">Key: each band is its own status track. The Confirmed rule joins the tracks: the downpayment must be verified in the payment track before a booking can be confirmed. Cancelling feeds the refund track.</text>
</svg>