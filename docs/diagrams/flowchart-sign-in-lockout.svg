<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1392" width="1240" height="1392" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1240" height="1392" fill="#fff"/>
<text x="620" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Flowchart: Sign-In and Account Lockout</text>
<path d="M330,142 L330,180" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,246 L330,284" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M455,336 L501,336" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="329" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M330,388 L330,426" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="406" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,492 L330,530" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M455,582 L501,582" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="575" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,634 L330,672" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="652" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M330,738 L330,776" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M455,828 L501,828" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="821" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,880 L330,918" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="898" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M330,984 L330,1022" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,1088 L330,1126" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,1192 L330,1230" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="205" y="90" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="330" y="120.33333333333333">User enters email and password</tspan></text>
<rect x="205" y="180" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="209.33333333333334">Email is cleaned up; both fields</tspan><tspan x="330" y="225.33333333333334">are required</tspan></text>
<polygon points="330,284 455,336 330,388 205,336" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="324.6666666666667">Is the account locked</tspan><tspan x="330" y="340.1666666666667">right now? (checked in</tspan><tspan x="330" y="355.6666666666667">the database)</tspan></text>
<rect x="205" y="426" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="455.3333333333333">Email and password are sent to</tspan><tspan x="330" y="471.3333333333333">the sign-in service</tspan></text>
<polygon points="330,530 455,582 330,634 205,582" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="578.4166666666666">Are the email and</tspan><tspan x="330" y="593.9166666666666">password correct?</tspan></text>
<rect x="205" y="672" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="693.3333333333334">The failure counter and any lock</tspan><tspan x="330" y="709.3333333333334">are cleared; the profile is</tspan><tspan x="330" y="725.3333333333334">loaded</tspan></text>
<polygon points="330,776 455,828 330,880 205,828" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="832.1666666666666">Is the account active?</tspan></text>
<rect x="205" y="918" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="939.3333333333334">Password gate: an invited account</tspan><tspan x="330" y="955.3333333333334">must set its own new password</tspan><tspan x="330" y="971.3333333333334">first and cannot skip it</tspan></text>
<rect x="205" y="1022" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="1035.3333333333333">Terms gate: if the current terms</tspan><tspan x="330" y="1051.3333333333333">for this role are not accepted,</tspan><tspan x="330" y="1067.3333333333333">the user must scroll to the end</tspan><tspan x="330" y="1083.3333333333333">and accept</tspan></text>
<rect x="205" y="1126" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="1139.3333333333333">Role check: Customer goes to the</tspan><tspan x="330" y="1155.3333333333333">customer portal, Staff to the</tspan><tspan x="330" y="1171.3333333333333">staff portal, Administrator to</tspan><tspan x="330" y="1187.3333333333333">the admin portal</tspan></text>
<rect x="205" y="1230" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="330" y="1260.3333333333333">Signed in</tspan></text>
<rect x="501" y="290" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="325.3333333333333">Refused: shows the</tspan><tspan x="581" y="339.8333333333333">minutes left, or</tspan><tspan x="581" y="354.3333333333333">"check your email"</tspan></text>
<rect x="501" y="536" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="571.3333333333334">Failure is recorded</tspan><tspan x="581" y="585.8333333333334">(see the ladder on</tspan><tspan x="581" y="600.3333333333334">the right)</tspan></text>
<rect x="501" y="782" width="160" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="581" y="802.8333333333334">Signed out (a</tspan><tspan x="581" y="817.3333333333334">self-deactivated</tspan><tspan x="581" y="831.8333333333334">account can be</tspan><tspan x="581" y="846.3333333333334">recovered within 15</tspan><tspan x="581" y="860.8333333333334">days)</tspan></text>
<rect x="820" y="290" width="360" height="442" rx="10" fill="none" stroke="#111" stroke-width="1.8"/>
<rect x="820" y="290" width="360" height="34" rx="10" fill="#111"/>
<text x="1000" y="312" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Lockout ladder (kept in the database)</text>
<line x1="820" y1="332" x2="1180" y2="332" stroke="#bbb"/>
<text x="834" y="350" font-size="12.5" font-weight="800" fill="#111">Wrong passwords 1 to 4</text>
<text font-size="12" fill="#111"><tspan x="834" y="370">No lock. The screen says how many tries are</tspan><tspan x="834" y="385">left.</tspan></text>
<line x1="820" y1="410" x2="1180" y2="410" stroke="#bbb"/>
<text x="834" y="428" font-size="12.5" font-weight="800" fill="#111">5th wrong password</text>
<text font-size="12" fill="#111"><tspan x="834" y="448">Locked for 5 minutes.</tspan></text>
<line x1="820" y1="488" x2="1180" y2="488" stroke="#bbb"/>
<text x="834" y="506" font-size="12.5" font-weight="800" fill="#111">6th wrong password</text>
<text font-size="12" fill="#111"><tspan x="834" y="526">Allowed (a small fresh allowance after the</tspan><tspan x="834" y="541">wait).</tspan></text>
<line x1="820" y1="566" x2="1180" y2="566" stroke="#bbb"/>
<text x="834" y="584" font-size="12.5" font-weight="800" fill="#111">7th wrong password</text>
<text font-size="12" fill="#111"><tspan x="834" y="604">Locked for 10 minutes.</tspan></text>
<line x1="820" y1="644" x2="1180" y2="644" stroke="#bbb"/>
<text x="834" y="662" font-size="12.5" font-weight="800" fill="#111">8th wrong password</text>
<text font-size="12" fill="#111"><tspan x="834" y="682">Held for 60 minutes. A security notice with</tspan><tspan x="834" y="697">a password-reset link is emailed to the</tspan><tspan x="834" y="712">owner.</tspan></text>
<text x="1000" y="744" text-anchor="middle" font-size="11" fill="#444">An unknown email gets the same answer as a wrong password.</text>
<path d="M661,582 L796,582 L796,390 L820,390" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
</svg>