<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" width="1500" height="1020" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1500" height="1020" fill="#fff"/>
<text x="750" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">System Architecture</text>
<rect x="70" y="50" width="560" height="60" rx="12" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="350" y="74.33333333333333">Customers, staff, and administrators</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="350" y="91.66666666666667">Phone or computer browser</tspan></text>
<path d="M350,110 L350,175" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="360" y="145.83333333333334">Open the website</tspan></text>
<rect x="60" y="175" width="580" height="220" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="60" y="175" width="580" height="30" rx="10" fill="#111"/><text x="350" y="195" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Web application on Vercel (comargarage.com)</text><text font-size="11.5" fill="#111"><tspan x="72" y="227">•</tspan><tspan x="84" y="227">Built with React and Vite; one site with customer, staff, and administrator screens</tspan></text><text font-size="11.5" fill="#111"><tspan x="72" y="249">•</tspan><tspan x="84" y="249">Booking wizard, payment and receipt screens, chat, reports</tspan></text><text font-size="11.5" fill="#111"><tspan x="72" y="271">•</tspan><tspan x="84" y="271">Automatic sign-out after 60 minutes without activity</tspan></text><text font-size="11.5" fill="#111"><tspan x="72" y="293">•</tspan><tspan x="84" y="293">Receives live updates without reloading</tspan></text>
<rect x="790" y="175" width="640" height="220" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="790" y="175" width="640" height="30" rx="10" fill="#111"/><text x="1110" y="195" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Backend service on Render (Express)</text><text font-size="11.5" fill="#111"><tspan x="802" y="227">•</tspan><tspan x="814" y="227">Sensitive actions that need the server: cancel, add service, reconcile payments, staff accounts and</tspan><tspan x="814" y="241">invitations</tspan></text><text font-size="11.5" fill="#111"><tspan x="802" y="263">•</tspan><tspan x="814" y="263">Receipt reading (OCR) with Tesseract</tspan></text><text font-size="11.5" fill="#111"><tspan x="802" y="285">•</tspan><tspan x="814" y="285">Scheduled jobs: every 5 minutes (overdue and no-show check, unpaid-hold release, login notices);</tspan><tspan x="814" y="299">every 24 hours (inactive-staff check)</tspan></text><text font-size="11.5" fill="#111"><tspan x="802" y="321">•</tspan><tspan x="814" y="321">Checks the signed-in user and role on every request</tspan></text>
<path d="M640,285 L790,285" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="715" y="235.33333333333334">Sensitive requests</tspan><tspan x="715" y="249.83333333333334">with the sign-in</tspan><tspan x="715" y="264.33333333333337">token</tspan></text>
<rect x="50" y="520" width="1400" height="330" rx="14" fill="none" stroke="#111" stroke-width="2.2"/>
<rect x="50" y="520" width="1400" height="32" rx="14" fill="#111"/>
<text x="750" y="542" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Supabase platform</text>
<rect x="124" y="580" width="220" height="240" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="124" y="580" width="220" height="30" rx="10" fill="#111"/><text x="234" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Authentication</text><text font-size="11.5" fill="#111"><tspan x="136" y="632">•</tspan><tspan x="148" y="632">Sign-in and sessions</tspan></text><text font-size="11.5" fill="#111"><tspan x="136" y="654">•</tspan><tspan x="148" y="654">Password recovery</tspan></text><text font-size="11.5" fill="#111"><tspan x="136" y="676">•</tspan><tspan x="148" y="676">Sign-in lockout and security</tspan><tspan x="148" y="690">notices</tspan></text>
<rect x="362" y="580" width="270" height="240" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="362" y="580" width="270" height="30" rx="10" fill="#111"/><text x="497" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">PostgreSQL database</text><text font-size="11.5" fill="#111"><tspan x="374" y="632">•</tspan><tspan x="386" y="632">Tables with row-level security,</tspan><tspan x="386" y="646">functions, and triggers</tspan></text><text font-size="11.5" fill="#111"><tspan x="374" y="668">•</tspan><tspan x="386" y="668">Audit log and notifications</tspan></text><text font-size="11.5" fill="#111"><tspan x="374" y="690">•</tspan><tspan x="386" y="690">Scheduled jobs: no-show lifecycle every</tspan><tspan x="386" y="704">5 minutes, photo clean-up daily</tspan></text>
<rect x="650" y="580" width="220" height="240" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="650" y="580" width="220" height="30" rx="10" fill="#111"/><text x="760" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Realtime</text><text font-size="11.5" fill="#111"><tspan x="662" y="632">•</tspan><tspan x="674" y="632">Pushes changes to open screens</tspan></text><text font-size="11.5" fill="#111"><tspan x="662" y="654">•</tspan><tspan x="674" y="654">Chat, bookings, payments,</tspan><tspan x="674" y="668">notifications</tspan></text>
<rect x="888" y="580" width="220" height="240" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="888" y="580" width="220" height="30" rx="10" fill="#111"/><text x="998" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Storage</text><text font-size="11.5" fill="#111"><tspan x="900" y="632">•</tspan><tspan x="912" y="632">payment-receipts</tspan></text><text font-size="11.5" fill="#111"><tspan x="900" y="654">•</tspan><tspan x="912" y="654">chat_media</tspan></text><text font-size="11.5" fill="#111"><tspan x="900" y="676">•</tspan><tspan x="912" y="676">Service photos</tspan></text>
<rect x="1126" y="580" width="250" height="240" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="1126" y="580" width="250" height="30" rx="10" fill="#111"/><text x="1251" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Edge functions</text><text font-size="11.5" fill="#111"><tspan x="1138" y="632">•</tspan><tspan x="1150" y="632">booking-lifecycle (status emails and</tspan><tspan x="1150" y="646">receipts)</tspan></text><text font-size="11.5" fill="#111"><tspan x="1138" y="668">•</tspan><tspan x="1150" y="668">send-notification-email</tspan></text><text font-size="11.5" fill="#111"><tspan x="1138" y="690">•</tspan><tspan x="1150" y="690">send-refund-receipt</tspan></text><text font-size="11.5" fill="#111"><tspan x="1138" y="712">•</tspan><tspan x="1150" y="712">send-status-email</tspan></text>
<path d="M200,395 L200,520" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="210" y="446.3333333333333">Sign-in, reads and writes</tspan><tspan x="210" y="460.8333333333333">(row-level security), live</tspan><tspan x="210" y="475.3333333333333">updates, file uploads</tspan></text>
<path d="M1000,395 L1000,520" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="1010" y="453.5833333333333">Service-level reads and</tspan><tspan x="1010" y="468.0833333333333">writes, scheduled jobs</tspan></text>
<path d="M1300,395 L1300,520" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="1310" y="460.8333333333333">Email requests</tspan></text>
<rect x="1101" y="911" width="300" height="58" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="13" font-weight="800" fill="#111"><tspan x="1251" y="935.3333333333334">Resend (email service)</tspan></text><text text-anchor="middle" font-size="11" font-weight="400" fill="#111"><tspan x="1251" y="951.6666666666666">Delivers the emails to inboxes</tspan></text>
<path d="M1251,820 L1251,911" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text text-anchor="start" font-size="11.5" font-weight="600" fill="#111"><tspan x="1261" y="869.8333333333334">Emails</tspan></text>
<text x="60" y="990" font-size="11.5" fill="#111">Key: the web application talks to Supabase directly for ordinary data, protected by row-level security, and to the backend only for actions that need the server to decide. All emails go through the Supabase edge functions to Resend.</text>
</svg>