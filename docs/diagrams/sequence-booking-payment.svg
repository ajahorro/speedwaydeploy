<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 1146" width="1235" height="1146" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1235" height="1146" fill="#fff"/>
<text x="617.5" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Sequence Diagram: Customer Books an Appointment with a Digital Payment</text>
<line x1="177.5" y1="110" x2="177.5" y2="1056" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="92.5" y="70" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="177.5" y="94.33333333333333">Customer</tspan></text>
<rect x="92.5" y="1056" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="177.5" y="1080.3333333333333">Customer</tspan></text>
<line x1="412.5" y1="110" x2="412.5" y2="1056" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="327.5" y="70" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="412.5" y="94.33333333333333">Web app</tspan></text>
<rect x="327.5" y="1056" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="412.5" y="1080.3333333333333">Web app</tspan></text>
<line x1="647.5" y1="110" x2="647.5" y2="1056" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="562.5" y="70" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="647.5" y="94.33333333333333">Backend</tspan></text>
<rect x="562.5" y="1056" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="647.5" y="1080.3333333333333">Backend</tspan></text>
<line x1="882.5" y1="110" x2="882.5" y2="1056" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="797.5" y="70" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="882.5" y="94.33333333333333">Database</tspan></text>
<rect x="797.5" y="1056" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="882.5" y="1080.3333333333333">Database</tspan></text>
<line x1="1117.5" y1="110" x2="1117.5" y2="1056" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="1032.5" y="70" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="1117.5" y="94.33333333333333">Email service</tspan></text>
<rect x="1032.5" y="1056" width="170" height="40" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="1117.5" y="1080.3333333333333">Email service</tspan></text>
<path d="M179.5,190 L410.5,190" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="295" y="168">1. Choose vehicles, services,</tspan><tspan x="295" y="182">date, and time</tspan></text>
<path d="M414.5,240 L880.5,240" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="647.5" y="232">2. Read shop settings, services, promos, and blocked times</tspan></text>
<path d="M880.5,290 L414.5,290" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="647.5" y="282">3. Current rules</tspan></text>
<path d="M414.5,354 L645.5,354" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="530" y="332">4. Check that the time is free</tspan><tspan x="530" y="346">(advice only)</tspan></text>
<path d="M649.5,404 L880.5,404" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="765" y="396">5. Read the existing bookings</tspan></text>
<path d="M645.5,454 L414.5,454" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="530" y="446">6. The time is free</tspan></text>
<path d="M179.5,518 L410.5,518" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="295" y="496">7. Upload the GCash or bank</tspan><tspan x="295" y="510">receipt</tspan></text>
<path d="M414.5,568 L645.5,568" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="530" y="560">8. Send the receipt image</tspan></text>
<rect x="641.5" y="586" width="12" height="40" fill="#fff" stroke="#111" stroke-width="1.4"/>
<path d="M653.5,594 L681.5,594 L681.5,616 L653.5,616" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="691.5" y="598">9. Read the receipt text (OCR); compare</tspan><tspan x="691.5" y="612">amount, shop account, and reference</tspan></text>
<path d="M645.5,706 L414.5,706" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="530" y="670">10. Receipt accepted, or marked</tspan><tspan x="530" y="684">for the administrator to check by</tspan><tspan x="530" y="698">hand</tspan></text>
<path d="M414.5,756 L880.5,756" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="647.5" y="748">11. Create the booking in one step</tspan></text>
<rect x="876.5" y="774" width="12" height="96" fill="#fff" stroke="#111" stroke-width="1.4"/>
<path d="M888.5,782 L916.5,782 L916.5,804 L888.5,804" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="926.5" y="786">12. Re-check hours, closed</tspan><tspan x="926.5" y="800">days, blocked times, room,</tspan><tspan x="926.5" y="814">price, and promo; save the</tspan><tspan x="926.5" y="828">booking, vehicles, services,</tspan><tspan x="926.5" y="842">and the payment waiting for</tspan><tspan x="926.5" y="856">verification</tspan></text>
<path d="M880.5,922 L414.5,922" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="647.5" y="914">13. Booking created</tspan></text>
<path d="M414.5,972 L1115.5,972" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="765" y="964">14. Ask for the booking-created email</tspan></text>
<path d="M1115.5,1022 L179.5,1022" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke"><tspan x="647.5" y="1014">15. Email and in-app notice</tspan></text>
<text x="40" y="1128" font-size="11.5" fill="#111">Key: solid arrow = request; dashed arrow = response; a small loop = a step inside that part. The database repeats the checks, so the earlier ones only save time.</text>
</svg>