<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1322" width="1480" height="1322" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1480" height="1322" fill="#fff"/>
<text x="740" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Flowchart: Account Creation and Invitation Logic</text>
<rect x="525" y="50" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="650" y="80.33333333333333">A person needs an account</tspan></text>
<polygon points="650,108 775,160 650,212 525,160" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="650" y="156.41666666666666">How is the account</tspan><tspan x="650" y="171.91666666666666">created?</tspan></text>
<path d="M650,102 L650,108" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="26" y="236" width="468" height="936" rx="10" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="25" y="256" width="290" height="50" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="170" y="285">A. Customer signs up on their own</tspan></text>
<path d="M170,306 L170,336" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M525,160 L170,160 L170,256" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="180" y="152" font-size="11.5" font-weight="700" fill="#111">Signs up on their own</text>
<path d="M170,402 L170,440" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M170,506 L170,544" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M295,596 L341,596" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="301" y="589" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M170,648 L170,686" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="178" y="666" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M170,752 L170,790" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M295,842 L341,842" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="301" y="835" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M170,894 L170,932" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="178" y="912" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M170,998 L170,1036" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="45" y="336" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="170" y="357.3333333333333">Opens Register and enters name,</tspan><tspan x="170" y="373.3333333333333">email, mobile number, and</tspan><tspan x="170" y="389.3333333333333">password</tspan></text>
<rect x="45" y="440" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="170" y="453.3333333333333">System checks the email and</tspan><tspan x="170" y="469.3333333333333">mobile number formats, matching</tspan><tspan x="170" y="485.3333333333333">passwords, and a password of at</tspan><tspan x="170" y="501.3333333333333">least 6 characters</tspan></text>
<polygon points="170,544 295,596 170,648 45,596" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="170" y="592.4166666666666">Is the email already</tspan><tspan x="170" y="607.9166666666666">registered?</tspan></text>
<rect x="45" y="686" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="170" y="707.3333333333334">Account is created as a CUSTOMER</tspan><tspan x="170" y="723.3333333333334">and is not yet active; an</tspan><tspan x="170" y="739.3333333333334">activation link is emailed</tspan></text>
<polygon points="170,790 295,842 170,894 45,842" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="170" y="838.4166666666666">Is the activation link</tspan><tspan x="170" y="853.9166666666666">valid and unused?</tspan></text>
<rect x="45" y="932" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="170" y="953.3333333333334">Email is confirmed, the session</tspan><tspan x="170" y="969.3333333333334">starts, and the customer profile</tspan><tspan x="170" y="985.3333333333334">is saved</tspan></text>
<rect x="45" y="1036" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="170" y="1065.3333333333333">Accepts the customer terms and</tspan><tspan x="170" y="1081.3333333333333">conditions on first open</tspan></text>
<rect x="341" y="561" width="150" height="70" rx="26.923076923076923" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="416" y="585.3333333333334">Stop: told to sign</tspan><tspan x="416" y="599.8333333333334">in or reset the</tspan><tspan x="416" y="614.3333333333334">password</tspan></text>
<rect x="341" y="807" width="150" height="70" rx="26.923076923076923" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="416" y="831.3333333333334">Told the link</tspan><tspan x="416" y="845.8333333333334">expired; asks for a</tspan><tspan x="416" y="860.3333333333334">new one</tspan></text>
<path d="M170,1102 L170,1152 L650,1152 L650,1190" fill="none" stroke="#111" stroke-width="1.5" />
<rect x="506" y="236" width="468" height="936" rx="10" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="505" y="256" width="290" height="50" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="650" y="277">B. Staff or administrator invited by</tspan><tspan x="650" y="293">an administrator</tspan></text>
<path d="M650,306 L650,336" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M650,212 L650,256" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="660" y="234" font-size="11.5" font-weight="700" fill="#111">Invited by an administrator</text>
<path d="M650,402 L650,440" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M775,492 L821,492" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="781" y="485" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M650,544 L650,582" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="658" y="562" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M775,634 L821,634" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="781" y="627" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M650,686 L650,724" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="658" y="704" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M650,790 L650,828" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M650,894 L650,932" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M650,998 L650,1036" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="525" y="336" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="650" y="357.3333333333333">Administrator enters the email,</tspan><tspan x="650" y="373.3333333333333">name, and role (Staff or</tspan><tspan x="650" y="389.3333333333333">Administrator) on Staff Roles</tspan></text>
<polygon points="650,440 775,492 650,544 525,492" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="650" y="480.6666666666667">Is the caller a</tspan><tspan x="650" y="496.1666666666667">signed-in, active</tspan><tspan x="650" y="511.6666666666667">administrator?</tspan></text>
<polygon points="650,582 775,634 650,686 525,634" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="650" y="622.6666666666666">Does an account with</tspan><tspan x="650" y="638.1666666666666">this email already</tspan><tspan x="650" y="653.6666666666666">exist?</tspan></text>
<rect x="525" y="724" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="650" y="737.3333333333334">Account is created, email already</tspan><tspan x="650" y="753.3333333333334">confirmed, with a random</tspan><tspan x="650" y="769.3333333333334">temporary password and a "must</tspan><tspan x="650" y="785.3333333333334">change password" flag</tspan></text>
<rect x="525" y="828" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="650" y="841.3333333333334">Invitation email with the login</tspan><tspan x="650" y="857.3333333333334">link and temporary password is</tspan><tspan x="650" y="873.3333333333334">sent; the action is written to</tspan><tspan x="650" y="889.3333333333334">the audit log</tspan></text>
<rect x="525" y="932" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="650" y="953.3333333333334">Invitee signs in and is forced to</tspan><tspan x="650" y="969.3333333333334">set their own password before</tspan><tspan x="650" y="985.3333333333334">anything else</tspan></text>
<rect x="525" y="1036" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="650" y="1065.3333333333333">Accepts the staff or</tspan><tspan x="650" y="1081.3333333333333">administrator terms on first open</tspan></text>
<rect x="821" y="457" width="150" height="70" rx="26.923076923076923" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="896" y="495.8333333333333">Refused</tspan></text>
<rect x="821" y="599" width="150" height="70" rx="26.923076923076923" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="896" y="616.0833333333334">If a customer: role</tspan><tspan x="896" y="630.5833333333334">is raised and</tspan><tspan x="896" y="645.0833333333334">history kept.</tspan><tspan x="896" y="659.5833333333334">Otherwise refused</tspan></text>
<path d="M650,1102 L650,1152 L650,1152 L650,1190" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="986" y="236" width="468" height="936" rx="10" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="985" y="256" width="290" height="50" rx="6" fill="#111"/>
<text text-anchor="middle" font-size="13" font-weight="800" fill="#fff"><tspan x="1130" y="277">C. Walk-in customer invited to</tspan><tspan x="1130" y="293">register</tspan></text>
<path d="M1130,306 L1130,336" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M775,160 L1130,160 L1130,256" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="785" y="152" font-size="11.5" font-weight="700" fill="#111">Invited after a walk-in booking</text>
<path d="M1130,402 L1130,440" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1130,506 L1130,544" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1255,596 L1301,596" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1261" y="589" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M1130,648 L1130,686" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1138" y="666" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M1130,752 L1130,790" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1130,856 L1130,894" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1130,960 L1130,998" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1005" y="336" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="1130" y="357.3333333333333">Administrator books a walk-in</tspan><tspan x="1130" y="373.3333333333333">guest who gave an email address</tspan><tspan x="1130" y="389.3333333333333">(no account yet)</tspan></text>
<rect x="1005" y="440" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="1130" y="453.3333333333333">System creates a one-time</tspan><tspan x="1130" y="469.3333333333333">registration invite tied to that</tspan><tspan x="1130" y="485.3333333333333">booking, valid 7 days, and emails</tspan><tspan x="1130" y="501.3333333333333">the link</tspan></text>
<polygon points="1130,544 1255,596 1130,648 1005,596" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="1130" y="592.4166666666666">Is the invite unused and</tspan><tspan x="1130" y="607.9166666666666">not expired?</tspan></text>
<rect x="1005" y="686" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="1130" y="707.3333333333334">Register form opens with the</tspan><tspan x="1130" y="723.3333333333334">email filled in and locked; name</tspan><tspan x="1130" y="739.3333333333334">and phone can be corrected</tspan></text>
<rect x="1005" y="790" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="1130" y="811.3333333333334">Guest sets a password and</tspan><tspan x="1130" y="827.3333333333334">activates the account through the</tspan><tspan x="1130" y="843.3333333333334">emailed link (as in A)</tspan></text>
<rect x="1005" y="894" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="1130" y="915.3333333333334">Invite is marked used and the</tspan><tspan x="1130" y="931.3333333333334">guest's bookings are linked to</tspan><tspan x="1130" y="947.3333333333334">the new customer account</tspan></text>
<rect x="1005" y="998" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="1130" y="1027.3333333333333">Accepts the customer terms on</tspan><tspan x="1130" y="1043.3333333333333">first open</tspan></text>
<rect x="1301" y="561" width="150" height="70" rx="26.923076923076923" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="1376" y="592.5833333333334">Normal sign-up form</tspan><tspan x="1376" y="607.0833333333334">is shown instead</tspan></text>
<path d="M1130,1064 L1130,1152 L650,1152 L650,1190" fill="none" stroke="#111" stroke-width="1.5" />
<rect x="525" y="1190" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="650" y="1212.3333333333333">Signed in: sent to the portal for</tspan><tspan x="650" y="1228.3333333333333">their role</tspan></text>
<text x="740" y="1272" text-anchor="middle" font-size="12" fill="#333">Every sign-in then goes through the lockout check (see the Sign-In and Lockout flowchart). Staff and administrator accounts cannot be self-registered.</text>
</svg>