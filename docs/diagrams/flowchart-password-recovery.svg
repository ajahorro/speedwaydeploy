<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1562" width="1180" height="1562" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="1180" height="1562" fill="#fff"/>
<text x="590" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111">Flowchart: Password Recovery (Forgot and Reset)</text>
<path d="M330,142 L330,180" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,246 L330,284" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,350 L330,388" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M455,440 L485,440" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="433" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,492 L330,530" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="510" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M330,596 L330,634" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,700 L330,738" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,804 L330,842" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M455,894 L485,894" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="887" font-size="11.5" font-weight="700" fill="#111">No</text>
<path d="M330,946 L330,984" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="338" y="964" font-size="11.5" font-weight="700" fill="#111">Yes</text>
<path d="M330,1050 L330,1088" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,1154 L330,1192" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,1258 L330,1296" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330,1362 L330,1400" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="205" y="90" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="330" y="120.33333333333333">User forgets the password</tspan></text>
<rect x="205" y="180" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="209.33333333333334">Chooses "Forgot password?" and</tspan><tspan x="330" y="225.33333333333334">enters the account email</tspan></text>
<rect x="205" y="284" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="297.3333333333333">System always shows the same</tspan><tspan x="330" y="313.3333333333333">message: "If an account exists, a</tspan><tspan x="330" y="329.3333333333333">reset link was sent" (so nobody</tspan><tspan x="330" y="345.3333333333333">can test which emails exist)</tspan></text>
<polygon points="330,388 455,440 330,492 205,440" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="436.4166666666667">Does an active account</tspan><tspan x="330" y="451.9166666666667">with this email exist?</tspan></text>
<rect x="205" y="530" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="543.3333333333334">Earlier unused reset requests are</tspan><tspan x="330" y="559.3333333333334">cancelled; a new one-time token</tspan><tspan x="330" y="575.3333333333334">is made and only its hash is</tspan><tspan x="330" y="591.3333333333334">stored</tspan></text>
<rect x="205" y="634" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="655.3333333333334">Reset link with the token is</tspan><tspan x="330" y="671.3333333333334">emailed; it is valid for 15</tspan><tspan x="330" y="687.3333333333334">minutes</tspan></text>
<rect x="205" y="738" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="767.3333333333334">User opens the link; the system</tspan><tspan x="330" y="783.3333333333334">checks the token</tspan></text>
<polygon points="330,842 455,894 330,946 205,894" fill="#fff" stroke="#111" stroke-width="1.8"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="330" y="890.4166666666666">Is the token genuine,</tspan><tspan x="330" y="905.9166666666666">unused, and not expired?</tspan></text>
<rect x="205" y="984" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="1005.3333333333334">Set-new-password form: password</tspan><tspan x="330" y="1021.3333333333334">of at least 6 characters, typed</tspan><tspan x="330" y="1037.3333333333335">twice</tspan></text>
<rect x="205" y="1088" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="1109.3333333333333">Token is claimed in one step</tspan><tspan x="330" y="1125.3333333333333">(marked used) so the link works</tspan><tspan x="330" y="1141.3333333333333">only once, even if clicked twice</tspan></text>
<rect x="205" y="1192" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="1221.3333333333333">Password is updated in the</tspan><tspan x="330" y="1237.3333333333333">sign-in service</tspan></text>
<rect x="205" y="1296" width="250" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="13" font-weight="400" fill="#111"><tspan x="330" y="1325.3333333333333">Security email "your password was</tspan><tspan x="330" y="1341.3333333333333">reset" is sent to the owner</tspan></text>
<rect x="205" y="1400" width="250" height="52" rx="26" fill="#fff" stroke="#111" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="700" fill="#111"><tspan x="330" y="1422.3333333333333">User signs in with the new</tspan><tspan x="330" y="1438.3333333333333">password</tspan></text>
<rect x="485" y="394" width="150" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="560" y="443.8333333333333">Nothing is sent</tspan></text>
<rect x="485" y="848" width="150" height="92" rx="35.38461538461539" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="1 0"/><text text-anchor="middle" font-size="11.5" font-weight="600" fill="#111"><tspan x="560" y="876.0833333333334">Told the link is</tspan><tspan x="560" y="890.5833333333334">expired or invalid;</tspan><tspan x="560" y="905.0833333333334">can request a new</tspan><tspan x="560" y="919.5833333333334">one</tspan></text>
<rect x="715" y="150" width="290" height="84" rx="12" fill="#fff" stroke="#111" stroke-width="1.6"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111"><tspan x="860" y="172.91666666666666">Second entry: after repeated wrong</tspan><tspan x="860" y="188.41666666666666">passwords the system emails a security</tspan><tspan x="860" y="203.91666666666666">notice with the same kind of reset</tspan><tspan x="860" y="219.41666666666666">link</tspan></text>
<path d="M860,234 L860,667 L455,667" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="1140" y="1544" text-anchor="end" font-size="11" fill="#555">The reset never reveals the old password and never signs the user in automatically.</text>
</svg>