name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      # Guard scripts (single source of truth, catalog/SQL sync, ...), backend syntax, frontend build.
      - run: node scripts/verify-all.mjs
      - run: node --test frontend/src/utils/refundRequestUtils.test.js

  lint:
    # Not yet known to be clean: reported, but does not block until its first run is reviewed.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
